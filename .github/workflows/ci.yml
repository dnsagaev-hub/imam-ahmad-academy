# Проверка сайта при каждом изменении кода:
# устанавливает зависимости, создаёт таблицы базы, заполняет демо-материалами,
# собирает сайт, запускает его и открывает основные страницы.
# Если миграции базы ещё нет — создаёт её и сохраняет в репозиторий вместе с package-lock.json.
name: Проверка сборки

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/academy
      PAYLOAD_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_DB_PUSH: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Проверить, что все версии пакетов существуют
        run: |
          node -e "const p=require('./package.json');for(const [n,v] of Object.entries({...p.dependencies,...p.devDependencies}))console.log(n+'@'+v)" | while read spec; do
            v=$(npm view "$spec" version 2>/dev/null | tail -1); echo "${v:-НЕТ ТАКОЙ ВЕРСИИ}  $spec"
          done 2>&1 | tee -a ci.log

      - name: Установка зависимостей
        run: (npm install --no-audit --no-fund) 2>&1 | tee -a ci.log

      - name: Создать первую миграцию базы (если её ещё нет)
        run: |
          if ls src/migrations/*.ts | grep -v '/index.ts$' >/dev/null 2>&1; then
            echo "Миграции уже есть"
          else
            npm run migrate:create -- initial 2>&1 | tee -a ci.log
            ls -la src/migrations
          fi

      - name: Применить миграции
        run: (npm run migrate) 2>&1 | tee -a ci.log

      - name: Новая миграция, если изменилась структура базы
        run: |
          (timeout 600 npm run migrate:create -- update --skip-empty < /dev/null) 2>&1 | tee mc.log | tee -a ci.log
          if grep -q "renamed from" mc.log; then echo "::error::Миграция требует ответа на вопрос о переименовании столбца"; exit 1; fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::Структура базы изменилась, а миграции в ветке нет: npm run migrate:create -- <имя> и закоммитить" | tee -a ci.log; exit 1
          fi
          ls src/migrations | tee -a ci.log
          (npm run migrate < /dev/null) 2>&1 | tee -a ci.log

      - name: Демо-наполнение
        run: (npm run seed) 2>&1 | tee -a ci.log

      - name: Проверка типов
        run: (npx tsc --noEmit) 2>&1 | tee -a ci.log

      - name: Сборка сайта
        run: (npm run build) 2>&1 | tee -a ci.log

      - name: Запуск и проверка страниц
        run: |
          cp -r public .next/standalone/
          # Файлы, загруженные наполнением (картинка блока «Рисунок»): сервер ищет папку media от своей папки
          if [ -d media ]; then cp -r media .next/standalone/; fi
          cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          fail=0
          for path in / /courses "/courses?level=prep" /courses/stupen-1-03-fiqh-ibadat /courses/demo-fikh-ochischeniya /lessons/demo-tayammum /text /audio /video \
                      "/text?category=fiqh" "/text?book=ahsar-al-muhtasarat" "/audio?category=aqida" "/audio?book=net-takoy-knigi" "/video?book=ahsar-al-muhtasarat" \
                      /articles /articles/tayammum-pri-holodnoy-vode /articles/pochemu-u-imama-ahmada-neskolko-mneniy \
                      /library /library/ahsar-al-muhtasarat /library/kashshaf-al-qina /contact /progress /prayer-times /about /admin \
                      /quran /quran/114 /quran/2 /hadith /hadith/akyda /hadith/akyda/islam-i-iman /hadith/smuty/fitan \
                      /fiqh /fiqh/ibadat /fiqh/ibadat/tahara /fiqh/ibadat/tahara/1 /fiqh/ibadat/tahara/2 /fiqh/sudoproizvodstvo/priznanie/1 \
                      /courses/demo-arabskiy-yazyk /lessons/demo-arabic-1 /lessons/demo-arabic-2 /lessons/arabskiy-urok-1 /lessons/arabskiy-urok-2 /lessons/arabskiy-urok-3 /lessons/arabskiy-urok-4 /lessons/arabskiy-urok-5 /lessons/arabskiy-urok-6 /lessons/arabskiy-urok-7 /lessons/arabskiy-urok-8 /lessons/arabskiy-urok-9 /lessons/arabskiy-urok-10 /lessons/arabskiy-urok-11 /lessons/arabskiy-urok-12 /lessons/arabskiy-urok-13 /courses/stupen-1-01-arabic/slovar /courses/demo-arabskiy-yazyk/slovar /courses/demo-arabskiy-yazyk/kartochki \
                      /search "/search?q=%D1%82%D0%B0%D1%8F%D0%BC%D0%BC%D1%83%D0%BC" "/search?q=%D0%B0%D0%BD-%D0%9D%D0%B0%D1%81&in=quran" "/search?q=x" "/search?q=$(printf '%0300d' 0)"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "http://127.0.0.1:3000$path")
            echo "$code  $path" | tee -a ci.log
            [ "$code" = "200" ] || fail=1
          done
          # Уроки по книгам (задача 9): полка, уроки книги, блок в библиотеке, книга без уроков
          # Страница сначала целиком в переменную: grep -q в конвейере с pipefail даёт ложный SIGPIPE у curl
          has() { local body; body=$(curl -s "http://127.0.0.1:3000$1"); [ -n "$body" ] && grep -qF "$2" <<< "$body"; }
          hasnt() { local body; body=$(curl -s "http://127.0.0.1:3000$1"); [ -n "$body" ] && ! grep -qF "$2" <<< "$body"; }
          check() { if eval "$2"; then echo "книги ok: $1" | tee -a ci.log; else echo "ОШИБКИ: уроки по книгам — $1" | tee -a ci.log; fail=1; fi; }
          check "полка текстовых уроков: книга из поля урока" 'has "/text" "lshelf-book" && has "/text?category=madhhab" "Аль-Мадхаль"'
          check "уроки книги, книга взята из курса" 'has "/text?book=ahsar-al-muhtasarat" "Таяммум"'
          check "блок «Уроки по этой книге»" 'has "/library/ahsar-al-muhtasarat" "Уроки по этой книге"'
          check "у книги без уроков блока нет" 'hasnt "/library/kashshaf-al-qina" "Уроки по этой книге"'
          check "несуществующая книга" 'has "/audio?book=net-takoy-knigi" "По этой книге аудиоуроков пока нет"'
          # Главная без лишнего (задача 11): только шапка, зелёный блок с кнопками и подвал
          check "главная: зелёный блок с кнопками" 'has "/" "Смотреть курсы"'
          check "главная: разделов ниже нет" 'hasnt "/" "Четыре ступени обучения" && hasnt "/" "Задать вопрос"'
          # Главная с дверью и эмблемой (задача 13): дверь на компьютере, эмблема за текстом на телефоне
          check "главная: арочная дверь и эмблема" 'has "/" "hero-door" && has "/" "emblem-white.png"'
          # Блок «Рисунок» в текстовом уроке (задача 14): картинка на месте и сам файл отдаётся
          check "урок: блок «Рисунок»" 'has "/lessons/pyat-osnov-fetv-imama-ahmada" "tl-figure" && has "/lessons/pyat-osnov-fetv-imama-ahmada" "/api/media/file/pyat-osnov-ahmada.svg"'
          check "рисунок: файл картинки" '[ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/media/file/pyat-osnov-ahmada.svg)" = "200" ]'
          # Блок «Хадис» (задача 17): своя рамка, арабский текст и сборник с номером
          check "урок: блок «Хадис»" 'has "/lessons/demo-tayammum" "tl-hadith" && has "/lessons/demo-tayammum" "Передал Муслим (№ 368)"'
          # Раздел «Коран» (задача 25): список сур, перевод из админки, сура без перевода, чтецы из миграции
          check "Коран: список сур" 'has "/quran" "аль-Мульк" && has "/quran" "ан-Нас"'
          check "Коран: перевод суры из админки" 'has "/quran/114" "Образец: перевод аята 6" && has "/quran/114" "tr-note"'
          # Пояснения к аяту (задача 33): кнопки только у заполненных, у аята 1 демо — все четыре, у аята 2 — одна
          check "Коран: пояснения к аяту" 'has "/quran/114" "Причина ниспослания" && has "/quran/114" "Связь с предыдущим отрывком" && has "/quran/114" "Размышление: аят 1" && hasnt "/quran/114" "Размышление: аят 2" && has "/quran/114" "Толкование: аят 2"'
          check "Коран: сура без перевода" 'has "/quran/2" "Перевод этой суры готовится" && hasnt "/quran/2" "ayah-tr"'
          check "Коран: чтецы из миграции" 'has "/quran/114" "Мишари ар-Рашид" && has "/quran/114" "Насир аль-Катами"'
          check "Коран: нет суры 115 и адреса 067" '[ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/quran/115)" = "404" ] && [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/quran/067)" = "404" ]'
          # Басмала перед каждой сурой, кроме ат-Таубы; у аль-Фатихи — тоже отдельно, без номера (задача 47)
          check "Коран: басмала перед сурой, кроме 9" 'has "/quran/2" "class=\"basmala\"" && hasnt "/quran/9" "class=\"basmala\""'
          # Подсветка читаемого аята (задача 26): адрес разметки отвечает всегда; разметка mp3quran по чтецам — для сведения
          # (на 21.10.2026 есть у чтецов 1, 3, 4, 6, 7; у Махира и Бадра ат-Турки нет)
          # Сборник переводов (задача 28): страница есть, гостю форма не показывается
          check "Коран: загрузка сборника только для администратора" 'has "/quran/import" "только для администратора" && hasnt "/quran/import" "name=\"file\""'
          # Сведения о суре (задача 31): кнопки только у заполненных пунктов, скрытая запись не показывается
          check "Коран: кнопки сведений о суре" 'has "/quran/114" "sh-info-btn" && has "/quran/114" "Цели суры" && has "/quran/114" "Хадис о достоинстве суры" && hasnt "/quran/114" "Тематика суры"'
          check "Коран: скрытые сведения о суре" 'hasnt "/quran/113" "aria-label=\"Сведения о суре\"" && hasnt "/quran/2" "aria-label=\"Сведения о суре\"" && has "/quran/114" "aria-label=\"Сведения о суре\""'
          # Раздел «Хадисы» (задача 37): деление книги из миграции, хадисы по главам, кнопки только у заполненного
          check "Хадисы: пункт меню и 10 тем" 'has "/" "href=\"/hadith\"" && has "/hadith" "العقيدة" && has "/hadith" "الفتن" && has "/hadith" "Поклонение"'
          check "Хадисы: книги темы" 'has "/hadith/akyda" "Ислам и иман" && has "/hadith/akyda" "الإيمان بالقدر"'
          check "Хадисы: хадисы по главам" 'has "/hadith/akyda/islam-i-iman" "بُنِيَ" && has "/hadith/akyda/islam-i-iman" "hd-sec" && has "/hadith/akyda/islam-i-iman" "Столпы ислама и имана"'
          check "Хадисы: кнопки под хадисом" 'has "/hadith/akyda/islam-i-iman" "Степень достоверности" && [ "$(curl -s http://127.0.0.1:3000/hadith/akyda/islam-i-iman | grep -o ">Разъяснение<" | wc -l)" = "1" ]'
          check "Хадисы: скрытый хадис не показан" 'hasnt "/hadith/akyda/islam-i-iman" "скрытый"'
          check "Хадисы: пустая книга и неверный адрес" 'has "/hadith/akyda/vera-v-predopredelenie" "готовятся" && [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/hadith/akyda/net-takoy)" = "404" ]'
          # Раздел «Фикх» (задача 46): деление и арабский текст «Зад аль-Мустакни‘» из миграции, перевод и пояснения — демо
          check "Фикх: пункт меню и 6 частей" 'has "/" "href=\"/fiqh\"" && has "/fiqh" "العبادات" && has "/fiqh" "القضاء" && has "/fiqh" "Судопроизводство"'
          check "Фикх: книги части по порядку" 'has "/fiqh/ibadat" "كتاب الطهارة" && has "/fiqh/ibadat" "كتاب الجهاد" && hasnt "/fiqh/ibadat" "كتاب البيع" && has "/fiqh/muamalat" "كتاب العتق" && hasnt "/fiqh/muamalat" "كتاب الفرائض"'
          check "Фикх: разделы книги" 'has "/fiqh/ibadat/tahara" "باب الآنية" && has "/fiqh/ibadat/tahara" "باب الحيض" && has "/fiqh/ibadat/tahara" "перевод готовится"'
          check "Фикх: текст раздела, темы и кнопки" 'has "/fiqh/ibadat/tahara/1" "ارتفاع الحدث" && has "/fiqh/ibadat/tahara/1" "Виды воды" && has "/fiqh/ibadat/tahara/1" "Введение в раздел" && has "/fiqh/ibadat/tahara/1" "Схема раздела" && has "/fiqh/ibadat/tahara/1" ">Фетва<" && has "/fiqh/ibadat/tahara/1" ">Второе мнение<"'
          check "Фикх: раздел без перевода" 'has "/fiqh/ibadat/tahara/2" "كل إناء طاهر" && has "/fiqh/ibadat/tahara/2" "Перевод этого раздела готовится" && hasnt "/fiqh/ibadat/tahara/2" "Введение в раздел"'
          check "Фикх: скрытый раздел и неверный адрес" 'hasnt "/fiqh/ibadat/tahara" "скрытый" && [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/fiqh/ibadat/tahara/99)" = "404" ] && [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/fiqh/net-takoy)" = "404" ]'
          # Задачи 38–41: переключатель «арабский / перевод», мусхаф суры и PDF, темы аятов, новые чтецы
          check "Коран: переключатель арабский и перевод" 'has "/quran/114" "Что показывать" && hasnt "/quran/2" "Что показывать"'
          # Задачи 47–48: басмала аль-Фатихи стоит отдельно; название суры из админки — в списке сур и на странице суры
          check "Коран: басмала аль-Фатихи отдельно" 'has "/quran/1" "class=\"basmala" && has "/quran/1" "id=\"a7\"" && hasnt "/quran/1" "id=\"a8\""'
          check "Коран: название суры из админки" 'has "/quran" "образец названия из админки" && has "/quran/113" "образец названия из админки"'
          # Задача 45: галочки «Темы» и «Пояснения», по умолчанию включены
          check "Коран: галочки тем и пояснений" 'has "/quran/114" "/>Темы</label>" && has "/quran/114" "/>Пояснения</label>" && has "/quran/114" "ayah-topic" && has "/quran/114" "class=\"ayah-note\""'
          check "Коран: тема аятов" 'has "/quran/114" "Образец темы аятов" && hasnt "/quran/113" "ayah-topic"'
          check "Коран: новые чтецы из миграции" 'has "/quran/114" "Ясир ад-Даусари" && has "/quran/114" "Абдуррашид Суфи"'
          # Задача 42: ещё три чтеца и короткое имя аль-Хусари; папки записей отвечают (первая сура)
          check "Коран: чтецы задачи 42" 'has "/quran/114" "Ахмад ас-Сувейлим" && has "/quran/114" "Раад аль-Курди" && has "/quran/114" "Омар аль-Дарвиз" && has "/quran/114" "Махмуд аль-Хусари" && hasnt "/quran/114" "Махмуд Халиль"'
          for f in ahmad-suwailem raad-kurdi omar-duraiwiz; do echo "mp3quran $f: $(curl -s -o /dev/null -r 0-0 -w "%{http_code}" https://cdn.mp3quran.net/audio/$f/r1/001.mp3)" | tee -a ci.log; done
          check "Коран: кнопки мусхафа у суры" 'has "/quran/51" "/quran/51/mushaf.pdf" && has "/quran/51" "стр. 520–523"'
          check "Коран: страницы мусхафа суры" 'has "/quran/51/mushaf" "/quran/mushaf/520" && has "/quran/51/mushaf" "/quran/mushaf/523" && hasnt "/quran/51/mushaf" "/quran/mushaf/524"'
          check "Коран: страница мусхафа — картинка" '[ "$(curl -s -o /dev/null -w "%{http_code} %{content_type}" http://127.0.0.1:3000/quran/mushaf/604)" = "200 image/png" ] && [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/quran/mushaf/605)" = "404" ]'
          check "Коран: PDF суры" '[ "$(curl -s http://127.0.0.1:3000/quran/114/mushaf.pdf | head -c 5)" = "%PDF-" ]'
          # Задача 44: мусхаф — одна страница или разворот, чтецы прямо на странице мусхафа
          check "Коран: вид мусхафа и чтецы" 'has "/quran/51/mushaf" "Две страницы" && has "/quran/51/mushaf" "Одна страница" && has "/quran/51/mushaf" "aria-label=\"Чтец\"" && has "/quran/51" "href=\"/quran/51/mushaf\""'
          # Курс арабского языка (задача 50): словарь урока, подсказки, огласовка, задания без ответов, словарь курса, карточки
          check "Арабский: подсказки к словам, плавающего словаря нет (решение владельца 28.10.2026)" 'hasnt "/lessons/demo-arabic-1" "vocab-dock" && hasnt "/lessons/demo-arabic-1" "dock-fab" && has "/lessons/demo-arabic-1" "class=\"ar-w\""'
          check "Арабский: задания и ключи" 'has "/lessons/demo-arabic-1" "id=\"tasks\"" && has "/lessons/demo-arabic-1" "Ключи: переводы"'
          check "Арабский: ответы заданий не уходят в браузер" 'hasnt "/lessons/demo-arabic-1" "هَذَا كِتَابٌ وَهَذَا قَلَمٌ" && hasnt "/lessons/demo-arabic-1" "Это дом? Да, это дом." && hasnt "/api/lessons?where%5Bslug%5D%5Bequals%5D=demo-arabic-1" "Это дом? Да" && hasnt "/api/lessons?where%5Bslug%5D%5Bequals%5D=demo-arabic-1" "\"right\":\"мечеть\""'
          check "Арабский: огласовка снята на уроке без огласовки" 'has "/lessons/demo-arabic-2" ">الكتاب<" && has "/lessons/demo-arabic-2" "Показать огласовку" && hasnt "/lessons/demo-arabic-1" "Показать огласовку"'
          check "Арабский: словарь курса и карточки" 'has "/courses/demo-arabskiy-yazyk" "/courses/demo-arabskiy-yazyk/slovar" && has "/courses/demo-arabskiy-yazyk/slovar" "كُتُبٌ" && has "/courses/demo-arabskiy-yazyk/kartochki" "Уроки с"'
          check "Арабский: урок 1 авторского учебника в курсе Тамхиди" 'has "/courses/stupen-1-01-arabic" "/lessons/arabskiy-urok-1" && has "/courses/stupen-1-01-arabic" "Арабский язык для чтения религиозных текстов" && has "/lessons/arabskiy-urok-1" "سَجَّادَةٌ" && has "/courses/stupen-1-01-arabic/slovar" "مُصْحَفٌ"'
          check "Арабский: словарь урока — имена и отдельно служебные слова" 'has "/lessons/arabskiy-urok-1" ">Имена<" && has "/lessons/arabskiy-urok-1" "ar-particles"'
          check "Арабский: картинки владельца к словам урока 1" 'has "/lessons/arabskiy-urok-1" "class=\"word-img\"" && has "/lessons/arabskiy-urok-1" "arabic-kitab"'
