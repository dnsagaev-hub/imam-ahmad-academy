# Проверка сайта при каждом изменении кода:
# устанавливает зависимости, создаёт таблицы базы, заполняет демо-материалами,
# собирает сайт, запускает его и открывает основные страницы.
# Если миграции базы ещё нет — создаёт её и сохраняет в репозиторий вместе с package-lock.json.
name: Проверка сборки

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/academy
      PAYLOAD_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_DB_PUSH: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Проверить, что все версии пакетов существуют
        run: |
          node -e "const p=require('./package.json');for(const [n,v] of Object.entries({...p.dependencies,...p.devDependencies}))console.log(n+'@'+v)" | while read spec; do
            v=$(npm view "$spec" version 2>/dev/null | tail -1); echo "${v:-НЕТ ТАКОЙ ВЕРСИИ}  $spec"
          done 2>&1 | tee -a ci.log

      - name: Установка зависимостей
        run: (npm install --no-audit --no-fund) 2>&1 | tee -a ci.log

      - name: Создать первую миграцию базы (если её ещё нет)
        run: |
          if ls src/migrations/*.ts | grep -v '/index.ts$' >/dev/null 2>&1; then
            echo "Миграции уже есть"
          else
            npm run migrate:create -- initial 2>&1 | tee -a ci.log
            ls -la src/migrations
          fi

      - name: Применить миграции
        run: (npm run migrate) 2>&1 | tee -a ci.log

      - name: Новая миграция, если изменилась структура базы
        run: |
          (timeout 600 npm run migrate:create -- update --skip-empty < /dev/null) 2>&1 | tee -a ci.log
          ls src/migrations | tee -a ci.log
          (npm run migrate < /dev/null) 2>&1 | tee -a ci.log

      - name: Демо-наполнение
        run: (npm run seed) 2>&1 | tee -a ci.log

      - name: Проверка типов
        run: (npx tsc --noEmit) 2>&1 | tee -a ci.log

      - name: Сборка сайта
        run: (npm run build) 2>&1 | tee -a ci.log

      - name: Запуск и проверка страниц
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          fail=0
          for path in / /courses "/courses?level=prep" /courses/stupen-1-03-fiqh-ibadat /courses/demo-fikh-ochischeniya /lessons/demo-tayammum /text /audio /video \
                      /articles /articles/tayammum-pri-holodnoy-vode /articles/pochemu-u-imama-ahmada-neskolko-mneniy \
                      /library /library/ahsar-al-muhtasarat /library/kashshaf-al-qina /contact /progress /prayer-times /about /admin; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "http://127.0.0.1:3000$path")
            echo "$code  $path" | tee -a ci.log
            [ "$code" = "200" ] || fail=1
          done
          cat server.log >> ci.log
          if [ $fail = 1 ]; then echo "--- server.log ---"; tail -n 200 server.log; exit 1; fi

      - name: Снимки страниц (компьютер и телефон)
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          npx -y playwright@1.56.1 install --with-deps chromium > /dev/null 2>&1
          cat > /tmp/shots.mjs <<'JS'
          import { chromium } from 'playwright'
          const pages = ['/', '/courses/demo-fikh-ochischeniya', '/lessons/pyat-osnov-fetv-imama-ahmada', '/lessons/demo-tayammum', '/courses', '/courses?level=beginner', '/courses/stupen-3-01-fiqh', '/text', '/audio', '/video', '/articles',
            '/articles/tayammum-pri-holodnoy-vode', '/library', '/library/ahsar-al-muhtasarat', '/contact', '/progress', '/prayer-times', '/admin']
          const browser = await chromium.launch()
          for (const [name, vp] of [['desk', { width: 1440, height: 900 }], ['phone', { width: 390, height: 844 }]]) {
            const ctx = await browser.newContext({ viewport: vp, locale: 'ru-RU', timezoneId: 'Europe/Moscow' })
            const page = await ctx.newPage()
            const errors = []
            page.on('pageerror', (e) => errors.push(e.message))
            page.on('console', (m) => m.type() === 'error' && errors.push(m.text()))
            for (const p of pages) {
              errors.length = 0
              await page.goto('http://127.0.0.1:3000' + p, { waitUntil: 'networkidle' }).catch((e) => errors.push(String(e)))
              await page.waitForTimeout(500)
              const file = '/tmp/shots/' + name + (p === '/' ? '_home' : p.replaceAll('/', '_')) + '.png'
              await page.screenshot({ path: file, fullPage: name === 'desk' })
              const overflow = await page.evaluate(() => {
                if (document.documentElement.scrollWidth <= window.innerWidth + 1) return ''
                const wide = [...document.querySelectorAll('body *')].filter((el) => el.getBoundingClientRect().right > window.innerWidth + 1)
                  .slice(0, 5).map((el) => el.tagName.toLowerCase() + '.' + String(el.className).split(' ').join('.') + ' →' + Math.round(el.getBoundingClientRect().right))
                return wide.join(', ')
              })
              console.log(name, p, errors.length ? 'ОШИБКИ: ' + errors.join(' | ').slice(0, 500) : 'ok', overflow ? 'ГОРИЗОНТАЛЬНАЯ ПРОКРУТКА: ' + overflow : '')
            }
            if (name === 'phone') {
              await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' })
              await page.click('.nav-toggle').catch(() => {})
              await page.click('.nav-item:nth-child(3) .nav-expand').catch(() => {})
              await page.waitForTimeout(300)
              await page.screenshot({ path: '/tmp/shots/phone_menu.png' })
            }
            await ctx.close()
          }
          await browser.close()
          JS
          (cd /tmp && npm i --no-save --silent playwright@1.56.1 >/dev/null 2>&1)
          (cd /tmp && node shots.mjs) 2>&1 | tee -a ci.log
          mv /tmp/shots . 2>/dev/null || true

      - name: Сборка Docker-образа (так же, как на хостинге)
        run: |
          docker build --progress=plain -t academy . > docker.log 2>&1 || { tail -n 80 docker.log | tee -a ci.log; exit 1; }
          tail -n 5 docker.log | tee -a ci.log

      - name: Сохранить миграцию и package-lock.json в репозиторий
        if: github.ref == 'refs/heads/main'
        run: |
          git add -A src/migrations package-lock.json
          if git diff --cached --quiet; then echo "Нечего сохранять"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Автоматически: миграция базы и package-lock.json [skip ci]"
          git push

      # Журнал проверки сохраняется в отдельную ветку ci-logs, чтобы его можно было прочитать без доступа к интерфейсу GitHub
      - name: Сохранить журнал проверки
        if: always()
        run: |
          mkdir -p /tmp/logs && (cp -r shots /tmp/logs/ 2>/dev/null || true); cp ci.log /tmp/logs/ci.log 2>/dev/null || echo "нет журнала" > /tmp/logs/ci.log
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/logs/status.txt
          cd /tmp/logs && git init -q -b ci-logs && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -qm "Журнал проверки ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
