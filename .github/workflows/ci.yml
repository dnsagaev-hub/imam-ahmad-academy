# Проверка сайта при каждом изменении кода:
# устанавливает зависимости, создаёт таблицы базы, заполняет демо-материалами,
# собирает сайт, запускает его и открывает основные страницы.
# Если миграции базы ещё нет — создаёт её и сохраняет в репозиторий вместе с package-lock.json.
name: Проверка сборки

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/academy
      PAYLOAD_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_DB_PUSH: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Проверить, что все версии пакетов существуют
        run: |
          node -e "const p=require('./package.json');for(const [n,v] of Object.entries({...p.dependencies,...p.devDependencies}))console.log(n+'@'+v)" | while read spec; do
            v=$(npm view "$spec" version 2>/dev/null | tail -1); echo "${v:-НЕТ ТАКОЙ ВЕРСИИ}  $spec"
          done 2>&1 | tee -a ci.log

      - name: Установка зависимостей
        run: (npm install --no-audit --no-fund) 2>&1 | tee -a ci.log

      - name: Создать первую миграцию базы (если её ещё нет)
        run: |
          if ls src/migrations/*.ts | grep -v '/index.ts$' >/dev/null 2>&1; then
            echo "Миграции уже есть"
          else
            npm run migrate:create -- initial 2>&1 | tee -a ci.log
            ls -la src/migrations
          fi

      - name: Применить миграции
        run: (npm run migrate) 2>&1 | tee -a ci.log

      - name: Новая миграция, если изменилась структура базы
        run: |
          (timeout 600 npm run migrate:create -- update --skip-empty < /dev/null) 2>&1 | tee mc.log | tee -a ci.log
          if grep -q "renamed from" mc.log; then echo "::error::Миграция требует ответа на вопрос о переименовании столбца"; exit 1; fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::Структура базы изменилась, а миграции в ветке нет: npm run migrate:create -- <имя> и закоммитить" | tee -a ci.log; exit 1
          fi
          ls src/migrations | tee -a ci.log
          (npm run migrate < /dev/null) 2>&1 | tee -a ci.log

      - name: Демо-наполнение
        run: (npm run seed) 2>&1 | tee -a ci.log

      - name: Проверка типов
        run: (npx tsc --noEmit) 2>&1 | tee -a ci.log

      - name: Сборка сайта
        run: (npm run build) 2>&1 | tee -a ci.log

      - name: Запуск и проверка страниц
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          (cd .next/standalone && NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          fail=0
          for path in / /courses "/courses?level=prep" /courses/stupen-1-03-fiqh-ibadat /courses/demo-fikh-ochischeniya /lessons/demo-tayammum /text /audio /video \
                      "/text?category=fiqh" "/text?book=ahsar-al-muhtasarat" "/audio?category=aqida" "/audio?book=net-takoy-knigi" "/video?book=ahsar-al-muhtasarat" \
                      /articles /articles/tayammum-pri-holodnoy-vode /articles/pochemu-u-imama-ahmada-neskolko-mneniy \
                      /library /library/ahsar-al-muhtasarat /library/kashshaf-al-qina /contact /progress /prayer-times /about /admin; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "http://127.0.0.1:3000$path")
            echo "$code  $path" | tee -a ci.log
            [ "$code" = "200" ] || fail=1
          done
          # Уроки по книгам (задача 8): полка, уроки книги, блок в библиотеке, книга без уроков
          # Страница сначала целиком в переменную: grep -q в конвейере с pipefail даёт ложный SIGPIPE у curl
          has() { local body; body=$(curl -s "http://127.0.0.1:3000$1"); [ -n "$body" ] && grep -qF "$2" <<< "$body"; }
          hasnt() { local body; body=$(curl -s "http://127.0.0.1:3000$1"); [ -n "$body" ] && ! grep -qF "$2" <<< "$body"; }
          check() { if eval "$2"; then echo "книги ok: $1" | tee -a ci.log; else echo "ОШИБКИ: уроки по книгам — $1" | tee -a ci.log; fail=1; fi; }
          check "полка текстовых уроков: книга из поля урока" 'has "/text" "lshelf-book" && has "/text?category=madhhab" "Аль-Мадхаль"'
          check "уроки книги, книга взята из курса" 'has "/text?book=ahsar-al-muhtasarat" "Таяммум"'
          check "блок «Уроки по этой книге»" 'has "/library/ahsar-al-muhtasarat" "Уроки по этой книге"'
          check "у книги без уроков блока нет" 'hasnt "/library/kashshaf-al-qina" "Уроки по этой книге"'
          check "несуществующая книга" 'has "/audio?book=net-takoy-knigi" "По этой книге аудиоуроков пока нет"'
          cat server.log >> ci.log
          if [ $fail = 1 ]; then echo "--- server.log ---"; tail -n 200 server.log; exit 1; fi

      - name: Статическая копия сайта для просмотра без интернета
        continue-on-error: true
        run: |
          mkdir -p /tmp/preview && cd /tmp/preview
          wget -q -e robots=off --recursive --level=4 --page-requisites --convert-links --adjust-extension --no-host-directories \
            --reject-regex '/(admin|api)(/|$)|\?' --domains 127.0.0.1 http://127.0.0.1:3000/ || true
          find . -name '*.html' | wc -l | sed 's/^/static pages: /' | tee -a $GITHUB_WORKSPACE/ci.log
          cd /tmp && mv preview imam-ahmad-academy-preview && zip -qr /tmp/site-preview.zip imam-ahmad-academy-preview
          ls -la /tmp/site-preview.zip | tee -a $GITHUB_WORKSPACE/ci.log

      - name: Снимки страниц (компьютер и телефон)
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          npx -y playwright@1.56.1 install --with-deps chromium > /dev/null 2>&1
          cat > /tmp/shots.mjs <<'JS'
          import { chromium } from 'playwright'
          const pages = ['/', '/courses/demo-fikh-ochischeniya', '/lessons/pyat-osnov-fetv-imama-ahmada', '/lessons/demo-tayammum', '/courses', '/courses?level=beginner', '/courses/stupen-3-01-fiqh', '/text', '/text?book=ahsar-al-muhtasarat', '/audio', '/video', '/articles',
            '/articles/tayammum-pri-holodnoy-vode', '/library', '/library/ahsar-al-muhtasarat', '/library/al-madkhal-ibn-badran', '/contact', '/progress', '/prayer-times', '/admin']
          const browser = await chromium.launch()
          for (const [name, vp] of [['desk', { width: 1440, height: 900 }], ['phone', { width: 390, height: 844 }]]) {
            const ctx = await browser.newContext({ viewport: vp, locale: 'ru-RU', timezoneId: 'Europe/Moscow' })
            const page = await ctx.newPage()
            const errors = []
            page.on('pageerror', (e) => errors.push(e.message))
            page.on('console', (m) => m.type() === 'error' && errors.push(m.text()))
            for (const p of pages) {
              errors.length = 0
              await page.goto('http://127.0.0.1:3000' + p, { waitUntil: 'networkidle' }).catch((e) => errors.push(String(e)))
              await page.waitForTimeout(500)
              const file = '/tmp/shots/' + name + (p === '/' ? '_home' : p.replaceAll('/', '_')) + '.png'
              await page.screenshot({ path: file, fullPage: name === 'desk' })
              const overflow = await page.evaluate(() => {
                if (document.documentElement.scrollWidth <= window.innerWidth + 1) return ''
                const wide = [...document.querySelectorAll('body *')].filter((el) => el.getBoundingClientRect().right > window.innerWidth + 1)
                  .slice(0, 5).map((el) => el.tagName.toLowerCase() + '.' + String(el.className).split(' ').join('.') + ' →' + Math.round(el.getBoundingClientRect().right))
                return wide.join(', ')
              })
              console.log(name, p, errors.length ? 'ОШИБКИ: ' + errors.join(' | ').slice(0, 500) : 'ok', overflow ? 'ГОРИЗОНТАЛЬНАЯ ПРОКРУТКА: ' + overflow : '')
            }
            if (name === 'phone') {
              await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' })
              await page.click('.nav-toggle').catch(() => {})
              await page.click('.nav-item:nth-child(3) .nav-expand').catch(() => {})
              await page.waitForTimeout(300)
              await page.screenshot({ path: '/tmp/shots/phone_menu.png' })
            }
            await ctx.close()
          }
          await browser.close()
          JS
          (cd /tmp && npm i --no-save --silent playwright@1.56.1 >/dev/null 2>&1)
          (cd /tmp && node shots.mjs) 2>&1 | tee -a ci.log
          mv /tmp/shots . 2>/dev/null || true

      - name: Сборка Docker-образа (так же, как на хостинге)
        run: |
          docker build --progress=plain -t imam-ahmad-academy-site . > docker.log 2>&1 || { tail -n 80 docker.log | tee -a ci.log; exit 1; }
          tail -n 5 docker.log | tee -a ci.log

      - name: Локальная версия (docker compose) запускается
        run: |
          SITE_PORT=3100 docker compose up -d --no-build
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:3100/ && break; sleep 2; done
          for path in / /courses /library /admin; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "http://127.0.0.1:3100$path"); echo "compose $code $path" | tee -a ci.log
            [ "$code" = "200" ] || { docker compose logs site | tail -n 80 | tee -a ci.log; exit 1; }
          done
          curl -s http://127.0.0.1:3100/courses | grep -q 'Тамхиди' && echo "compose: программа на месте" | tee -a ci.log
          # повторный запуск не должен ничего пересоздавать
          docker compose restart site; sleep 20
          curl -s -o /dev/null http://127.0.0.1:3100/ ; sleep 5
          docker compose logs site | grep -E "Стартовое|пропускаю|Программа" | tee -a ci.log || true
          bash "Сделать копию данных (Mac).command" < /dev/null | tail -n 4 | tee -a ci.log
          ls -la backups | tee -a ci.log
          grep -c "CREATE TABLE" backups/*.sql | tee -a ci.log
          docker compose down -v

      - name: Сохранить миграцию и package-lock.json в репозиторий
        if: github.ref == 'refs/heads/main'
        run: |
          git add -A src/migrations package-lock.json
          if git diff --cached --quiet; then echo "Нечего сохранять"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Автоматически: миграция базы и package-lock.json [skip ci]"
          git push

      # Журнал проверки сохраняется в отдельную ветку ci-logs, чтобы его можно было прочитать без доступа к интерфейсу GitHub
      - name: Сохранить журнал проверки
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          mkdir -p /tmp/logs && (cp -r shots /tmp/logs/ 2>/dev/null || true); (cp /tmp/site-preview.zip /tmp/logs/ 2>/dev/null || true); cp ci.log /tmp/logs/ci.log 2>/dev/null || echo "нет журнала" > /tmp/logs/ci.log
          echo "${{ job.status }} ${{ github.event.pull_request.head.sha || github.sha }} ${{ github.head_ref || github.ref_name }}" > /tmp/logs/status.txt
          cd /tmp/logs && git init -q -b ci-logs && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -qm "Журнал проверки ${{ github.event.pull_request.head.sha || github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
