          check "Поиск: только один раздел" 'has "/search?q=%D1%82%D0%B0%D1%8F%D0%BC%D0%BC%D1%83%D0%BC&in=fiqh" "/fiqh/ibadat/tahara/9" && hasnt "/search?q=%D1%82%D0%B0%D1%8F%D0%BC%D0%BC%D1%83%D0%BC&in=fiqh" "/lessons/demo-tayammum" && has "/search?q=%D0%9E%D0%B1%D1%80%D0%B0%D0%B7%D0%B5%D1%86%3A%20%D0%BF%D0%B5%D1%80%D0%B5%D0%B2%D0%BE%D0%B4%20%D0%B0%D1%8F%D1%82%D0%B0" "Все результаты раздела" && has "/search?q=%D0%9E%D0%B1%D1%80%D0%B0%D0%B7%D0%B5%D1%86%3A%20%D0%BF%D0%B5%D1%80%D0%B5%D0%B2%D0%BE%D0%B4%20%D0%B0%D1%8F%D1%82%D0%B0&in=quran" "/quran/114#a6"'
          check "Поиск: ничего не найдено" 'has "/search?q=%D0%B7%D1%8E%D0%B7%D1%8E%D0%B7%D1%8F%D0%BA%D0%B0%D0%B1%D1%80%D0%B0" "Ничего не найдено"'
